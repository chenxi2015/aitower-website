<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Pure Crisp White Squircle Background -->
    <linearGradient id="bgWhite" x1="512" y1="80" x2="512" y2="944" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="78%" stop-color="#FAFAFB" />
      <stop offset="100%" stop-color="#F2F2F5" />
    </linearGradient>

    <!-- Subtle Soft Ambient Monochrome Glow -->
    <radialGradient id="ambientAura" cx="512" cy="512" r="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181B" stop-opacity="0.035" />
      <stop offset="65%" stop-color="#71717A" stop-opacity="0.015" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Crisp Delicate Border -->
    <linearGradient id="borderStroke" x1="512" y1="80" x2="512" y2="944" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E4E4E7" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#D4D4D8" stop-opacity="0.95" />
    </linearGradient>

    <!-- Left Continuous 3D Ribbon (Foreground): Deep Obsidian Black -> Charcoal -->
    <linearGradient id="ribLeft" x1="540" y1="156" x2="208" y2="848" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#323238" />
      <stop offset="22%" stop-color="#1F1F24" />
      <stop offset="58%" stop-color="#121215" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>

    <!-- Right Continuous 3D Ribbon (Background Fold): Cool Medium Grey -> Silver -> Light Grey -->
    <linearGradient id="ribRight" x1="524" y1="220" x2="816" y2="836" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5E5E68" />
      <stop offset="30%" stop-color="#868692" />
      <stop offset="68%" stop-color="#AEAEBA" />
      <stop offset="100%" stop-color="#D0D0DC" />
    </linearGradient>

    <radialGradient id="floorGlow" cx="512" cy="856" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090B" stop-opacity="0.12" />
      <stop offset="65%" stop-color="#09090B" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Soft Outer Card Shadow -->
  <rect x="74" y="88" width="876" height="876" rx="202" fill="#09090B" fill-opacity="0.035" />
  <rect x="78" y="85" width="868" height="868" rx="198" fill="#09090B" fill-opacity="0.055" />
  <rect x="81" y="82" width="862" height="862" rx="195" fill="#09090B" fill-opacity="0.075" />

  <!-- Pure White Squircle (860x860) -->
  <rect x="82" y="82" width="860" height="860" rx="194" fill="url(#bgWhite)" />
  <rect x="82" y="82" width="860" height="860" rx="194" fill="url(#ambientAura)" />
  <rect x="83.5" y="83.5" width="857" height="857" rx="192.5" stroke="url(#borderStroke)" stroke-width="3" />

  <!-- Soft Floor Shadow -->
  <ellipse cx="512" cy="854" rx="320" ry="26" fill="url(#floorGlow)" />

  <!-- Soft Elevation Shadow Behind the Inverted-V (Centered at X=512) -->
  <g transform="translate(4, 16)" opacity="0.09">
    <path
      d="M 439.9 198.2 L 169.9 742.2 C 124.9 833.0, 261.0 900.6, 306.1 809.8 L 508.0 403.0 L 709.9 809.8 C 755.0 900.6, 891.1 833.0, 846.1 742.2 L 576.1 198.2 C 542.0 130.0, 474.0 130.0, 439.9 198.2 Z"
      fill="#09090B"
    />
  </g>

  <g transform="translate(4, 0)">
    <!-- Right 3D Ribbon Pillar (Mathematically Tangent at (576.1, 198.2)) -->
    <path
      d="M 439.9 265.8
         L 709.9 809.8
         C 755.0 900.6, 891.1 833.0, 846.1 742.2
         L 576.1 198.2
         L 496.0 210.0
         Z"
      fill="url(#ribRight)"
    />

    <!-- Left 3D Ribbon Pillar (C1-Continuous Stadium Capsule Sweeping Over Apex) -->
    <path
      d="M 439.9 198.2
         L 169.9 742.2
         C 124.9 833.0, 261.0 900.6, 306.1 809.8
         L 576.1 265.8
         C 621.1 175.0, 485.0 107.4, 439.9 198.2
         Z"
      fill="url(#ribLeft)"
    />
  </g>
</svg>
