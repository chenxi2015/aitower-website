<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" fill="none">
  <defs>
    <pattern id="dots-loop" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.9" fill="#d4d4d8" />
    </pattern>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#27272a" />
    </marker>
  </defs>
  <rect width="880" height="300" rx="16" fill="#fafaf9" />
  <rect width="880" height="300" rx="16" fill="url(#dots-loop)" />

  <!-- Step 1 -->
  <rect x="34" y="42" width="236" height="216" rx="14" fill="#ffffff" stroke="#27272a" stroke-width="1.5" />
  <rect x="52" y="60" width="42" height="24" rx="12" fill="#bfdbfe" />
  <text x="73" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">01</text>
  <text x="106" y="77" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#18181b">唤起配图</text>
  <text x="52" y="112" font-family="system-ui, sans-serif" font-size="12" fill="#52525b">在长文写作中点击</text>
  <text x="52" y="132" font-family="system-ui, sans-serif" font-size="12" fill="#52525b">「为本段配图」或用 Agent 提问</text>
  <rect x="52" y="156" width="200" height="78" rx="10" fill="#eff6ff" stroke="#bfdbfe" />
  <text x="152" y="184" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e40af">读取当前段落与关联笔记</text>
  <text x="152" y="206" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#3b82f6">read_note → draft_studio_board</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M 278 150 L 312 150" stroke="#27272a" stroke-width="1.8" marker-end="url(#arrow-loop)" />

  <!-- Step 2 -->
  <rect x="322" y="42" width="236" height="216" rx="14" fill="#ffffff" stroke="#27272a" stroke-width="1.5" />
  <rect x="340" y="60" width="42" height="24" rx="12" fill="#bbf7d0" />
  <text x="361" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#14532d">02</text>
  <text x="394" y="77" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#18181b">画板半手搓设计</text>
  <text x="340" y="112" font-family="system-ui, sans-serif" font-size="12" fill="#52525b">AI 起草节点与箭头后，</text>
  <text x="340" y="132" font-family="system-ui, sans-serif" font-size="12" fill="#52525b">直接在画布上微调细节与配色</text>
  <rect x="340" y="156" width="94" height="36" rx="8" fill="#fef08a" />
  <text x="387" y="178" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#713f12">手绘组件</text>
  <rect x="446" y="156" width="94" height="36" rx="8" fill="#e9d5ff" />
  <text x="493" y="178" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#581c87">便签标注</text>
  <rect x="340" y="202" width="200" height="32" rx="8" fill="#f0fdf4" stroke="#86efac" />
  <text x="440" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#166534">所有元素可自由拖拽编辑</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M 566 150 L 600 150" stroke="#27272a" stroke-width="1.8" marker-end="url(#arrow-loop)" />

  <!-- Step 3 -->
  <rect x="610" y="42" width="236" height="216" rx="14" fill="#ffffff" stroke="#27272a" stroke-width="1.5" />
  <rect x="628" y="60" width="42" height="24" rx="12" fill="#fef08a" />
  <text x="649" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#713f12">03</text>
  <text x="682" y="77" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#18181b">一键导出插入</text>
  <text x="628" y="112" font-family="system-ui, sans-serif" font-size="12" fill="#52525b">导出高清 PNG/SVG 存入</text>
  <text x="628" y="132" font-family="system-ui, sans-serif" font-size="12" fill="#52525b">Vault 资产目录并写入引用</text>
  <rect x="628" y="156" width="200" height="78" rx="10" fill="#18181b" />
  <text x="728" y="186" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#fef08a">![[架构演进图.png]]</text>
  <text x="728" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#d4d4d8">自动落位文章光标处 · 全程不跳出</text>
</svg>
