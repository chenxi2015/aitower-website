  <text x="520" y="68" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#18181b">aitower Desktop Workbench</text>
  <text x="520" y="88" font-family="system-ui, sans-serif" font-size="11" fill="#71717a">Zero lock-in · Your files stay yours</text>

