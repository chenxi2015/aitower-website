      <path d="M 1 1 L 9 5 L 1 9 z" fill="#27272a" />
    </marker>
  </defs>
  <rect width="880" height="300" rx="16" fill="#fafaf9" />
  <rect width="880" height="300" rx="16" fill="url(#dots-vault-en)" />

