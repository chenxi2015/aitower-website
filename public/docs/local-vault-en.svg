  <path d="M 486 168 L 370 168" stroke="#27272a" stroke-width="1.8" marker-end="url(#arrow-vault-en)" />
  <text x="428" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#27272a">Direct R/W</text>
